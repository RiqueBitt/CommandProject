[package]
name = "cp-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
texpresso = { version = "2.0.2", features = ["rayon"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt-multi-thread", "macros", "net"] }
walkdir = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
