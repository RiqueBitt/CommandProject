[package]
name = "commandproject"
version = "0.4.0"
description = "CommandProject — launcher e hub de mods do Supreme Commander 2"
authors = ["RiqueBitt"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "commandproject_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cp-core = { path = "../crates/cp-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
