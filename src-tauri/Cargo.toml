[package]
name = "commandproject"
version = "0.58.0"
description = "CommandProject — launcher e hub de mods do Supreme Commander 2"
authors = ["RiqueBitt"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "commandproject_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cp-core = { path = "../crates/cp-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time", "net", "rt-multi-thread", "macros", "sync", "fs", "io-util"] }
# sala de convite (servidor do anfitrião: arquivos dos mods, sala e voz)
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rand = "0.10.3"
if-addrs = "0.15"
sha2 = "0.11.1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
