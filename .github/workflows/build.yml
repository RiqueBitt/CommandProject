name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Núcleo (Rust)
        shell: bash
        run: |
          # em caso de erro, o resumo vira anotação (visível sem abrir o log)
          report() { msg=$(grep -E "$2" -A10 "$1" | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=$3::$msg"; exit 1; }
          cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1 || report clippy.log '^(error|warning)' clippy
          cargo test --workspace > test.log 2>&1 || report test.log 'panicked|FAILED|^error|failures:' testes
          grep "test result" test.log
      - name: Shaders (compilador do ReShade, HLSL SM3 + GLSL)
        run: tools/shaders/check.sh target/shaders
      - uses: actions/upload-artifact@v4
        with:
          name: shaders-hlsl
          path: target/shaders/*.hlsl
      - name: Ponte do toolkit de mapas (jogo sintético)
        run: |
          python tools/test_maptk_bridge.py
          python tools/test_maptk_fast.py
      - name: Arquivos que entram no instalador
        run: python tools/check_resources.py
      - name: Comandante da IA (Lua num mundo falso)
        run: |
          python -m pip install --quiet lupa
          python tools/test_ai_commander.py
          python tools/test_bigmatch.py
          python tools/test_optimize.py
          python tools/test_firstperson.py
          python tools/test_gamelang.py
      - name: Interface
        run: |
          npm ci
          python tools/i18n_check.py > i18n.log || { grep FALTA i18n.log | head -50; exit 1; }
          tail -1 i18n.log
          npm run build
      - name: Gerador de mundos (determinístico, simétrico, bases alcançáveis)
        run: node --experimental-strip-types tools/test_worldgen.ts
      - name: Gerador de texturas
        run: node --experimental-strip-types tools/test_texgen.ts
      - name: Cores da Partida grande (times nunca com a mesma cor)
        run: node --experimental-strip-types tools/test_teamcolors.ts
      - name: Posições sorteadas da Partida grande
        run: |
          node --experimental-strip-types tools/test_matchspawn.ts
          node --experimental-strip-types tools/test_matchlimits.ts

  shaders-dx9:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shaders-hlsl
          path: shaders-hlsl
      - name: Compila cada passe para DirectX 9 (fxc.exe da Microsoft)
        shell: pwsh
        run: tools/shaders/check_dx9.ps1 shaders-hlsl

  windows:
    needs: [test, shaders-dx9]
    runs-on: windows-latest
    env:
      PYTHON_EMBED: "3.12.10"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Python embutido para o Estúdio de Mapas
        shell: pwsh
        run: |
          $zip = "python-$env:PYTHON_EMBED-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_EMBED/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath resources/python -Force
          resources/python/python.exe -c "import sys, zlib, zipfile; print(sys.version)"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          # em push na main (ou tag) cria a tag v<versão> e publica o release com o .exe
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: "CommandProject v__VERSION__"
          releaseBody: "Instalador para Windows. O launcher avisa sozinho quando sair uma versão nova."
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: CommandProject-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
